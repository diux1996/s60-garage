<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>S60 Garage</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1013; color: #c9ced6;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px; text-align: center; }
  a { color: #8fb4e0; }
</style>
</head>
<body>
<p id="m">Terug naar S60 Garage…</p>
<script>
  // Stuurt alleen code en state door naar de app (vast schema, dus geen open doorverwijzing).
  // Niets wordt opgeslagen of naar een server gestuurd.
  (function () {
    var q = new URLSearchParams(location.search), out = new URLSearchParams();
    ["code", "state", "error", "error_description"].forEach(function (k) { if (q.has(k)) out.set(k, q.get(k)); });
    var target = "s60garage://callback?" + out.toString();
    history.replaceState(null, "", location.pathname); // code uit de adresbalk en geschiedenis
    location.replace(target);
    setTimeout(function () {
      document.getElementById("m").innerHTML = 'Open je de app niet automatisch? <a href="' + target.replace(/"/g, "&quot;") + '">Tik hier</a>.';
    }, 1500);
  })();
</script>
</body>
</html>
