<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>S60 Garage</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1013; color: #c9ced6;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px; text-align: center; }
  a { color: #8fb4e0; }
</style>
</head>
<body>
<p id="m">Terug naar S60 Garage…</p>
<script>
  // Stuurt alleen code en state door naar de app (vast schema, dus geen open doorverwijzing).
  // Niets wordt opgeslagen of naar een server gestuurd.
  (function () {
    // Volvo kan de velden in de query (?code=) of in het fragment (#code=) zetten; beide worden gelezen.
    var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, "")), out = new URLSearchParams();
    ["code", "state", "error", "error_description"].forEach(function (k) { var v = q.get(k) || h.get(k); if (v) out.set(k, v); });
    var names = []; q.forEach(function (_, k) { names.push(k); }); h.forEach(function (_, k) { names.push("#" + k); });
    history.replaceState(null, "", location.pathname); // code uit de adresbalk en geschiedenis
    var m = document.getElementById("m");
    if (!out.has("code") && !out.has("error")) { // niets bruikbaars: toon alleen de veldnamen, nooit de waarden
      m.textContent = "Geen inlogcode ontvangen van Volvo. Ontvangen velden: " + (names.join(", ") || "geen") + "."; return;
    }
    if (out.has("error")) m.textContent = "Volvo meldt: " + out.get("error") + (out.has("error_description") ? " – " + out.get("error_description") : "");
    var target = "s60garage://callback?" + out.toString();
    setTimeout(function () { location.replace(target); }, out.has("error") ? 900 : 0);
    setTimeout(function () {
      var a = document.createElement("a"); a.href = target; a.textContent = "Tik hier";
      m.appendChild(document.createTextNode(" Open je de app niet automatisch? ")); m.appendChild(a);
    }, out.has("error") ? 2500 : 1500);
  })();
</script>
</body>
</html>
